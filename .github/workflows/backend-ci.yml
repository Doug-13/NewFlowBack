name: Backend CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
jobs:
  build-and-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DATABASE_URL: postgresql://newflow_ci:newflow_ci@127.0.0.1:5432/newflow_ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run build
      - name: Testes unitarios sem banco
        run: |
          if [ -d tests ]; then
            find tests -type f -name '*.test.ts' -print0 | xargs -0 -r node --import tsx --test
          fi
